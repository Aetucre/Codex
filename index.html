<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Visit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Trip Journal</p>
        <h1>Track your hotel and restaurant visits.</h1>
        <p>
          Add establishments, choose one from the dropdown, and record each visit with
          date-based notes on what you liked and disliked.
        </p>
      </header>

      <section class="panel">
        <h2>Add establishment</h2>
        <form id="establishment-form" class="grid-form">
          <label>
            <span>Name</span>
            <input id="establishment-name" type="text" placeholder="e.g. Seaside Bistro" required />
          </label>
          <label>
            <span>Type</span>
            <select id="establishment-type" required>
              <option value="Restaurant">Restaurant</option>
              <option value="Hotel">Hotel</option>
            </select>
          </label>
          <button type="submit">Add to dropdown</button>
        </form>
      </section>

      <section class="panel">
        <h2>Log visit</h2>
        <form id="visit-form" class="visit-form">
          <label>
            <span>Establishment</span>
            <select id="visit-establishment" required></select>
          </label>
          <label>
            <span>Visit date</span>
            <input id="visit-date" type="date" required />
          </label>
          <label>
            <span>What you liked (menu items, accommodations, amenities)</span>
            <textarea id="liked-notes" rows="3" placeholder="Great pasta, fast check-in, rooftop pool..."></textarea>
          </label>
          <label>
            <span>What you did not like</span>
            <textarea id="disliked-notes" rows="3" placeholder="Noisy room, slow service..."></textarea>
          </label>
          <button type="submit">Save visit</button>
        </form>
      </section>

      <section class="panel">
        <div class="results-header">
          <h2>Visit history</h2>
          <button id="clear-all" class="ghost" type="button">Clear all data</button>
        </div>
        <p id="empty-message" class="empty-message">No visits yet. Add an establishment and log your first visit.</p>
        <ul id="visit-list" class="visit-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
